[project]
name = "dmemo-hermes"
version = "0.1.0"
description = "dMemo memory provider for Hermes — mem0 OSS in-process, encrypted blobs on 0G Storage"
requires-python = ">=3.10"
dependencies = [
  "mem0ai>=2.0.14",
  "fastembed>=0.8.0",
  "faiss-cpu>=1.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dmemo-hermes-install = "dmemo_hermes.install:main"

[tool.setuptools.package-data]
dmemo_hermes = ["bridge/*.mjs", "hermes_plugin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: opens a real mem0 engine and local embedder"]
